<!DOCTYPE html>
<html lang="fr" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HashMap Storage Manager</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        gray: { 850: '#1f2937', 900: '#111827' }
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-gray-900 text-gray-200 h-screen flex overflow-hidden font-sans">

    <!-- PANEL 1 : File Manager (Sidebar) -->
    <aside class="w-80 bg-gray-800 border-r border-gray-700 flex flex-col">
        <div class="p-6 border-b border-gray-700">
            <h1 class="text-xl font-bold text-white mb-2">📁 Data Storage</h1>
            <p class="text-xs text-gray-400">Gère tes fichiers HashMap</p>
        </div>
        
        <!-- Créer un fichier -->
        <div class="p-4 border-b border-gray-700 bg-gray-850">
            <form id="create-file-form" class="flex gap-2">
                <input type="text" id="new-filename" placeholder="nouveau.json" required
                    class="w-full bg-gray-900 border border-gray-600 rounded px-3 py-2 text-sm text-white focus:outline-none focus:border-blue-500">
                <button type="submit" class="bg-blue-600 hover:bg-blue-500 text-white px-3 py-2 rounded text-sm font-bold transition">
                    +
                </button>
            </form>
        </div>

        <!-- Liste des fichiers -->
        <div class="flex-1 overflow-y-auto p-4" id="file-list">
            <!-- Injecté via JS -->
        </div>
    </aside>

    <!-- MAIN AREA -->
    <main class="flex-1 flex flex-col h-full bg-gray-900">
        
        <!-- HEADER : Fichier actif -->
        <header class="p-6 border-b border-gray-800 flex justify-between items-center">
            <div>
                <h2 class="text-2xl font-bold text-white" id="current-file-display">Sélectionne un fichier</h2>
                <p class="text-sm text-gray-400" id="file-status">En attente...</p>
            </div>
            <button id="refresh-btn" class="bg-gray-700 hover:bg-gray-600 px-4 py-2 rounded transition text-sm">
                🔄 Rafraîchir
            </button>
        </header>

        <div class="p-6 flex-1 overflow-y-auto flex flex-col gap-6">
            
            <!-- PANEL 2 : CRUD / Insertion -->
            <section class="bg-gray-800 rounded-xl border border-gray-700 p-6 shadow-lg">
                <h3 class="text-lg font-semibold text-white mb-4">Insérer une donnée (HashMap)</h3>
                <form id="insert-form" class="flex gap-4 items-end">
                    <div class="flex-1">
                        <label class="block text-xs font-bold text-gray-400 uppercase mb-1">Clé (Key)</label>
                        <input type="text" id="insert-key" required class="w-full bg-gray-900 border border-gray-600 rounded px-4 py-2 text-white focus:outline-none focus:border-green-500">
                    </div>
                    <div class="flex-1">
                        <label class="block text-xs font-bold text-gray-400 uppercase mb-1">Valeur (Value)</label>
                        <input type="text" id="insert-value" required class="w-full bg-gray-900 border border-gray-600 rounded px-4 py-2 text-white focus:outline-none focus:border-green-500">
                    </div>
                    <button type="submit" id="insert-btn" disabled class="bg-green-600 hover:bg-green-500 disabled:opacity-50 disabled:cursor-not-allowed text-white px-6 py-2 rounded font-bold transition">
                        Insérer
                    </button>
                </form>
            </section>

            <!-- PANEL 3 : File Viewer (Contenu JSON) -->
            <section class="bg-gray-800 rounded-xl border border-gray-700 flex-1 flex flex-col shadow-lg overflow-hidden">
                <div class="p-4 border-b border-gray-700 bg-gray-850 flex justify-between items-center">
                    <h3 class="text-sm font-semibold text-gray-300">🔍 Contenu du fichier</h3>
                    <span class="text-xs bg-gray-700 px-2 py-1 rounded text-gray-300" id="array-length">Taille: 0</span>
                </div>
                <div class="p-4 flex-1 overflow-auto bg-[#0d1117]">
                    <pre id="json-viewer" class="text-sm text-green-400 font-mono w-full h-full">{"status": "Sélectionne un fichier pour voir son contenu"}</pre>
                </div>
            </section>

        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
